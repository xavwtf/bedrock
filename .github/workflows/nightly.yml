name: Nightly build

on:
  schedule:
     - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  check_date:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    
    steps:
      - uses: actions/checkout@v3
      - name: Print latest commit
        run: echo ${{ github.sha }}
      
      - id: should_run
        continue-on-error: true
        name: Check latest commit date
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list --after="24 hours" ${{ github.sha }}) && echo "should_run=false" >> $GITHUB_OUTPUT

  build:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: "actions/checkout@v3"

      - name: Set up Docker Buildx
        uses: "docker/setup-buildx-action@v3"

      - name: Build Docker image (i386)
        run: |
          docker build -f buildenv/cross-i386.Dockerfile -t bedrock-build-i386 .

      # TODO: build any other cross images

      - name: Build Bedrock (i386)
        run: |
          docker run --rm -v ${{ github.workspace }}:/bedrock -w /bedrock bedrock-build-i386 bash -c "find . -type f -iname "*.sh" -exec chmod +x {} \; && make"
          
      # TODO: build Bedrock on any other targets

      - name: Set date variables
        id: vars
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "DATE_FANCY=$(date +%d/%m/%Y)" >> $GITHUB_ENV

      - name: Create release
        id: create_release
        uses: "actions/create-release@v1"
        with:
          tag_name: "nightly-${{ github.run_number }}"
          release_name: "Nightly ${{ github.run_number }} - ${{ env.DATE_FANCY }}"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO artifact
        uses: "actions/upload-release-asset@v1" 
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bedrock.iso
          asset_name: bedrock-nightly${{ github.run_number }}-${{ env.DATE }}.iso
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}